# Demo deployment: PostgreSQL, one coordinator, three workers.
#   docker compose up -d --build --wait
#   docker compose run --rm ctl submit --payload="task=payment;account=a;amount_cents=100"
#   scripts/demo-docker.sh            # scripted crash/pause demo
# Credentials are for local demos only. See docs/operations.md.
name: epochflow

# Built once (by the coordinator service) and reused by the other services.
x-image: &image
  image: epochflow:local
  pull_policy: never
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: epochflow
      POSTGRES_PASSWORD: epochflow
      POSTGRES_DB: epochflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epochflow -d epochflow"]
      interval: 1s
      timeout: 3s
      retries: 30

  coordinator:
    <<: *image
    build: .
    command:
      - epochflow-coordinator
      - --listen=0.0.0.0:50051
      - --dsn=host=postgres user=epochflow password=epochflow dbname=epochflow
      - --lease-ms=3000
      - --reclaim-interval-ms=250
    depends_on:
      postgres:
        condition: service_healthy
    # Host port below Windows' reserved dynamic range (see ADR 0001).
    ports:
      - "127.0.0.1:15051:50051"

  worker:
    <<: *image
    command:
      - epochflow-worker
      - --coordinator=coordinator:50051
      - --work-ms=150
      - --work-after-effect-ms=100
    depends_on:
      - coordinator
    deploy:
      replicas: 3

  # One-off client: docker compose run --rm ctl <command> ...
  ctl:
    image: epochflow:local
    pull_policy: never
    entrypoint: ["epochflowctl", "--coordinator=coordinator:50051"]
    profiles: ["tools"]
    depends_on:
      - coordinator

volumes:
  pgdata:
