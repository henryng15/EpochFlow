// Coordinator API between clients, workers, and the EpochFlow coordinator.
// Full semantics: docs/protocol.md.
//
// Error model (gRPC status codes, shared by all RPCs):
//   OK                   request applied (or an identical duplicate was recognized)
//   INVALID_ARGUMENT     malformed request; do not retry unchanged
//   NOT_FOUND            no job with that id
//   FAILED_PRECONDITION  stale assignment: the job is not RUNNING with the given
//                        generation. The worker must discard its work.
//   ALREADY_EXISTS       duplicate of the request that finished the job, but with
//                        different content. Nothing changed.
//   UNAVAILABLE, DEADLINE_EXCEEDED, INTERNAL
//                        outcome unknown. Retrying RenewLease, CompleteJob and
//                        FailJob with the same generation is safe.

syntax = "proto3";

package epochflow.v1;

service Coordinator {
  // Creates a PENDING job. Not idempotent: a retry after a lost response may
  // create a second job.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // Returns a snapshot of a job. Read-only; always safe to retry.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // Assigns the oldest PENDING job to the caller with a new generation and a
  // lease chosen by the coordinator. Returns no assignment when nothing is
  // PENDING. A retry after a lost response may assign a second job; the first
  // one is recovered when its lease expires.
  rpc AcquireJob(AcquireJobRequest) returns (AcquireJobResponse);

  // Extends the caller's lease by the coordinator's lease length. Doubles as
  // the worker heartbeat. FAILED_PRECONDITION means the lease is lost.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // RUNNING -> COMPLETED for the caller's generation.
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);

  // Records a failed attempt: re-queued if retryable and attempts remain,
  // otherwise FAILED. A retried retryable failure that already re-queued the
  // job returns FAILED_PRECONDITION, which the worker treats as done.
  rpc FailJob(FailJobRequest) returns (FailJobResponse);

  // Applies a ledger entry once per operation_id as part of the caller's
  // assignment (fenced). Retries, later attempts, and duplicate jobs with the
  // same operation_id and content get the original entry (deduplicated=true);
  // different content is ALREADY_EXISTS. Safe to retry.
  rpc ApplyLedgerOperation(ApplyLedgerOperationRequest) returns (ApplyLedgerOperationResponse);

  // Records the intent to call an external system that has no idempotency key
  // (fenced). The response says whether to call it (START), not to call it
  // because an earlier attempt may have (IN_DOUBT), or that it was already
  // confirmed (CONFIRMED). Safe to retry within the same attempt.
  rpc BeginExternalOperation(BeginExternalOperationRequest)
      returns (BeginExternalOperationResponse);

  // Stores the external system's confirmation. Not fenced: the answer is
  // recorded even from a stale attempt. Idempotent; a different confirmation
  // is ALREADY_EXISTS.
  rpc ConfirmExternalOperation(ConfirmExternalOperationRequest)
      returns (ConfirmExternalOperationResponse);

  // RUNNING -> UNKNOWN for the caller's generation: the outcome of an external
  // effect cannot be determined. The job is not retried or reclaimed until
  // ReconcileJob. Idempotent per generation and reason.
  rpc MarkJobUnknown(MarkJobUnknownRequest) returns (MarkJobUnknownResponse);

  // Operator decision: UNKNOWN -> COMPLETED or FAILED with evidence in
  // `detail`. FAILED_PRECONDITION if the job is not UNKNOWN (repeating the same
  // decision returns OK).
  rpc ReconcileJob(ReconcileJobRequest) returns (ReconcileJobResponse);
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_UNKNOWN = 5;
}

enum ExternalState {
  EXTERNAL_STATE_UNSPECIFIED = 0;
  EXTERNAL_STATE_START = 1;
  EXTERNAL_STATE_IN_DOUBT = 2;
  EXTERNAL_STATE_CONFIRMED = 3;
}

message Job {
  int64 job_id = 1;
  JobState state = 2;
  int64 generation = 3;
  // Set only while RUNNING.
  string worker_id = 4;
  // Unix milliseconds; 0 unless RUNNING.
  int64 lease_until_unix_ms = 5;
  int32 attempts = 6;
  int32 max_attempts = 7;
  bytes payload = 8;
  // Present when COMPLETED.
  optional bytes result = 9;
  // Most recent failure or recovery reason, if any.
  optional string error = 10;
}

message Assignment {
  int64 job_id = 1;
  // Fencing token; send it back with every renewal and result.
  int64 generation = 2;
  bytes payload = 3;
  // Coordinator's deadline in Unix milliseconds, for display. Workers should
  // schedule renewals from lease_ms instead, since clocks differ.
  int64 lease_until_unix_ms = 4;
  // Granted lease length in milliseconds.
  int64 lease_ms = 5;
  // 1-based attempt number.
  int32 attempt = 6;
}

message SubmitJobRequest {
  bytes payload = 1;
  // Total executions allowed. 0 selects the default (3); negative is invalid.
  int32 max_attempts = 2;
}

message SubmitJobResponse {
  int64 job_id = 1;
}

message GetJobRequest {
  int64 job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message AcquireJobRequest {
  // Required, non-empty. Recorded for observability; fencing uses generation.
  string worker_id = 1;
}

message AcquireJobResponse {
  // Absent when no job is PENDING.
  Assignment assignment = 1;
}

message RenewLeaseRequest {
  int64 job_id = 1;
  int64 generation = 2;
}

message RenewLeaseResponse {
  int64 lease_until_unix_ms = 1;
}

message CompleteJobRequest {
  int64 job_id = 1;
  int64 generation = 2;
  bytes result = 3;
}

message CompleteJobResponse {}

message FailJobRequest {
  int64 job_id = 1;
  int64 generation = 2;
  string reason = 3;
  bool retryable = 4;
}

message FailJobResponse {}

message ApplyLedgerOperationRequest {
  int64 job_id = 1;
  int64 generation = 2;
  // Stable across retries and attempts; required.
  string operation_id = 3;
  string account = 4;
  int64 amount_cents = 5;
}

message ApplyLedgerOperationResponse {
  string entry_id = 1;
  bool deduplicated = 2;
}

message BeginExternalOperationRequest {
  int64 job_id = 1;
  int64 generation = 2;
  string operation_id = 3;
  // Canonical request content; reuse with different content is ALREADY_EXISTS.
  string request = 4;
}

message BeginExternalOperationResponse {
  ExternalState state = 1;
  // Present when state is CONFIRMED.
  string confirmation = 2;
}

message ConfirmExternalOperationRequest {
  string operation_id = 1;
  string request = 2;
  string confirmation = 3;
}

message ConfirmExternalOperationResponse {}

message MarkJobUnknownRequest {
  int64 job_id = 1;
  int64 generation = 2;
  string reason = 3;
}

message MarkJobUnknownResponse {}

message ReconcileJobRequest {
  int64 job_id = 1;
  // JOB_STATE_COMPLETED or JOB_STATE_FAILED; anything else is INVALID_ARGUMENT.
  JobState outcome = 2;
  // Result (COMPLETED) or error (FAILED), typically the evidence used.
  string detail = 3;
}

message ReconcileJobResponse {}
