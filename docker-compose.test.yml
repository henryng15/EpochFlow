# Disposable PostgreSQL for integration tests. Data lives in tmpfs, so every
# `down` discards it. The credentials are test-only and not secrets.
# Usage: scripts/test-db.sh up|down|dsn
name: epochflow-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: epochflow
      POSTGRES_PASSWORD: epochflow
      POSTGRES_DB: epochflow_test
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epochflow -d epochflow_test"]
      interval: 1s
      timeout: 3s
      retries: 30
